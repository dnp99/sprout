name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + ES compatibility)
        run: npm run lint

      - name: Test (Vitest, with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # A dummy URL so the build never touches a real database. No route is
          # executed at build time, so this is only present to satisfy any
          # module-load-time reads.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/sprout"
