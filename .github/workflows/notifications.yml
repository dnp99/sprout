name: Scheduled notifications
on:
  schedule:
    # Best effort hourly check; avoid the busiest minute at the top of the hour.
    - cron: "7 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: notifications
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver due notifications
        env:
          APP_URL: ${{ vars.SPROUT_APP_URL }}
          CRON_SECRET: ${{ secrets.SPROUT_CRON_SECRET }}
        shell: bash
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure SPROUT_APP_URL and SPROUT_CRON_SECRET to enable notifications."
            exit 0
          fi
          status=$(curl --fail --silent --show-error --max-time 90 \
            --output /tmp/sprout-notifications.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/notifications")
          if [ "$status" != "200" ]; then
            echo "Notification endpoint returned HTTP $status; check the canonical app URL."
            exit 1
          fi
          cat /tmp/sprout-notifications.json
